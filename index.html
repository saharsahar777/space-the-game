<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE 0.4 — 8-BIT PIXEL UNIVERSE</title>
<style>
:root{--violet:#7900a8;--purple:#b000ef;--cyan:#36eaff;--green:#00a982;--ink:#09051c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08051b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100dvh;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#24105b 0,#10072c 48%,#050817 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:linear-gradient(180deg,rgba(16,26,58,.92),rgba(8,9,30,.86));border:1px solid rgba(74,226,255,.48);box-shadow:0 0 16px #1b9cce35,inset 0 0 12px #5c4dff20;border-radius:8px;padding:8px 11px}
.brand{font-size:12px;letter-spacing:2px;color:#8cf7ff;font-weight:900}.coords{font-size:10px;color:#b7c5ff;margin-top:3px}.stats{text-align:right;font-size:11px;color:#dce9ff}.stats b{color:#5ff5ff;font-size:14px}
.hint{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;color:#d8caff;background:#170b35a8;border:1px solid #9e4bff55;border-radius:20px;padding:6px 11px;white-space:nowrap;pointer-events:none}
.ship{position:absolute;left:50%;top:48%;width:0;height:0;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 0 8px #ff315d)}
.ship svg{width:54px;height:76px;overflow:visible;transform-origin:50% 50%;transition:transform .12s}
.ship .trail{position:absolute;left:50%;top:55px;transform:translateX(-50%);width:18px;height:44px;background:linear-gradient(#ff4b89aa,transparent);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);filter:blur(3px)}
.crosshair{position:absolute;left:50%;top:48%;width:110px;height:110px;transform:translate(-50%,-50%);border:1px dashed #4ceeff35;border-radius:50%;pointer-events:none}
.controls{position:absolute;bottom:0;left:0;right:0;height:23%;min-height:150px;max-height:210px;background:linear-gradient(180deg,transparent 0%,#26003d 22%,#520078 100%);clip-path:polygon(0 12%,35% 55%,39% 100%,61% 100%,65% 55%,100% 12%,100% 100%,0 100%);z-index:5}
.controlbar{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:clamp(18px,7vw,42px);z-index:6}
.ctrl{width:64px;height:64px;border-radius:50%;border:2px solid #a5faff;background:radial-gradient(circle at 35% 25%,#226f83,#09253c 70%);color:#dfffff;box-shadow:0 0 15px #21dfff77,inset 0 0 12px #36f5ff44;display:grid;place-items:center;font-size:28px;font-weight:900;user-select:none;-webkit-tap-highlight-color:transparent}
.ctrl.forward{width:82px;height:82px;border-color:#7dffe1;background:radial-gradient(circle at 35% 25%,#14c9a1,#00644f 70%);box-shadow:0 0 22px #00ffc477,inset 0 0 14px #caffef55;font-size:32px}
.ctrl:active{transform:scale(.93);filter:brightness(1.4)}.ctrl small{display:block;font-size:8px;letter-spacing:1px;margin-top:-7px}
.ctrlwrap{display:flex;flex-direction:column;align-items:center;gap:5px}.label{font-size:9px;color:#b9faff;letter-spacing:1px;text-shadow:0 1px 4px #000}
.system-card{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:3;padding:7px 10px;border-radius:7px;background:#100c2bd9;border:1px solid #7d5aff66;font-size:10px;color:#d8d1ff;white-space:nowrap;pointer-events:none}
.toast{position:absolute;left:50%;bottom:25%;transform:translate(-50%,10px);background:#071d2beF;border:1px solid #47eaff;border-radius:8px;padding:8px 12px;font-size:11px;color:#cfffff;opacity:0;transition:.2s;z-index:8;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.legend{position:absolute;left:12px;bottom:24%;font-size:9px;color:#c2b9ef;line-height:1.7;pointer-events:none;text-shadow:0 1px 3px #000}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
@media(min-width:700px){#game{max-width:430px;margin:auto;border-left:1px solid #46316b;border-right:1px solid #46316b}.hud{top:18px}.controls{height:190px}}
</style>
</head>
<body>
<div id="game">
<canvas id="space"></canvas>
<div class="hud">
 <div class="panel"><div class="brand">SPACE // 0.4 · 8-BIT</div><div class="coords" id="coords">СЕКТОР 07 : 014</div></div>
 <div class="panel stats">СИСТЕМЫ <b id="count">128</b><br>ТОПЛИВО <b id="fuel">24</b></div>
</div>
<div class="hint">ПИЛОТИРОВАНИЕ · СВОБОДНЫЙ ПОЛЁТ</div>
<div class="system-card" id="nearby">БЛИЖАЙШАЯ СИСТЕМА: ЭЛЬТАР</div>
<div class="crosshair"></div>
<div class="ship" id="ship">
 <div class="trail"></div>
 <svg viewBox="0 0 64 88" shape-rendering="crispEdges" aria-label="Пиксельный корабль игрока">
  <g stroke="#17142c" stroke-width="2" stroke-linejoin="miter">
   <path fill="#9bff42" d="M8 42h8V25h5v-8h5v18h-5v20h-8v-7H8zM56 42h-8V25h-5v-8h-5v18h5v20h8v-7h5z"/>
   <path fill="#d72d65" d="M27 3h10v8h5v10h5v19h-7v12H24V40h-7V21h5V11h5z"/>
   <path fill="#f6d9e6" d="M27 3h10v8H27zM22 18h5v9h-5zM37 18h5v9h-5zM17 34h7v8h-7zM40 34h7v8h-7z"/>
   <path fill="#3ce8ff" d="M29 17h6v7h4v17h-4v9h-6v-9h-4V24h4z"/>
   <path fill="#fff1a8" d="M29 11h6v6h-6z"/>
   <path fill="#a7b8ca" d="M24 49h16v7H24zM19 56h7v8h-7zM38 56h7v8h-7z"/>
   <path fill="#ff4b9a" d="M21 64h5v12h-5zM38 64h5v12h-5z"/>
   <path fill="#fff" d="M28 55h8v6h-8z"/>
  </g>
  <path d="M23 76h4l-2 8zM37 76h4l-2 8z" fill="#48f4ff"/>
 </svg>
</div>
<div class="legend"><i style="background:#55f4ff"></i>известная система<br><i style="background:#ffbf48"></i>неизученная система<br><i style="background:#d65cff"></i>туманность</div>
<div class="controls"></div>
<div class="controlbar">
 <div class="ctrlwrap"><button class="ctrl" id="left" aria-label="Повернуть влево">↶</button><span class="label">ВЛЕВО</span></div>
 <div class="ctrlwrap"><button class="ctrl forward" id="forward" aria-label="Лететь вперёд">▲</button><span class="label">ВПЕРЁД</span></div>
 <div class="ctrlwrap"><button class="ctrl" id="right" aria-label="Повернуть вправо">↷</button><span class="label">ВПРАВО</span></div>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
let w=0,h=0,dpr=1,angle=0,fuel=24,travel=0,sector=7,systems=[],stars=[],nebulae=[],toastTimer;
const rand=(a,b)=>Math.random()*(b-a)+a;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=game.clientWidth;h=game.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;generate();draw()}
function generate(){
 stars=Array.from({length:190},()=>({x:rand(0,w),y:rand(0,h),r:rand(.5,1.8),a:rand(.25,1),p:rand(0,6)}));
 nebulae=Array.from({length:13},()=>({x:rand(-40,w+40),y:rand(20,h*.82),r:rand(30,80),c:Math.random()<.7?'#a000e8':'#4c27bb',a:rand(.12,.27)}));
 systems=Array.from({length:24},(_,i)=>({x:rand(18,w-18),y:rand(100,h*.78),type:Math.floor(rand(0,5)),name:['Эльтар','Вега-9','Криос','Немезис','Аркадия','Таргон','Орион'][i%7],seen:i<3}));
 // ensure a visible route network around the flight axis
 systems[0]={x:w*.54,y:h*.22,type:2,name:'Эльтар',seen:true};
 systems[1]={x:w*.29,y:h*.39,type:1,name:'Вега-9',seen:true};
 systems[2]={x:w*.73,y:h*.62,type:3,name:'Криос',seen:true};
 systems[3]={x:w*.18,y:h*.72,type:0,name:'Немезис',seen:false};
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.setLineDash([3,7]);ctx.strokeStyle='rgba(95,215,255,.38)';ctx.lineWidth=1.4;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function draw(){
 ctx.clearRect(0,0,w,h);
 let bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#08051e');bg.addColorStop(.55,'#12052f');bg.addColorStop(1,'#05091d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 // nebulae soft pixel-like clouds
 nebulae.forEach(n=>{ctx.save();ctx.globalAlpha=n.a;for(let k=0;k<4;k++){ctx.fillStyle=n.c;ctx.beginPath();ctx.arc(n.x+Math.cos(k*1.7)*n.r*.35,n.y+Math.sin(k*1.9)*n.r*.25,n.r*(.65+(.1*k)),0,Math.PI*2);ctx.fill()}ctx.restore()});
 stars.forEach(s=>{let tw=.55+.45*Math.sin(Date.now()/800+s.p);ctx.globalAlpha=s.a*tw;ctx.fillStyle='#fff4dc';ctx.fillRect(Math.round(s.x),Math.round(s.y),s.r>1.3?2:1,s.r>1.3?2:1);if(s.r>1.5){ctx.fillRect(s.x-3,s.y,7,1);ctx.fillRect(s.x,s.y-3,1,7)}});ctx.globalAlpha=1;
 // routes
 const order=[systems[0],systems[1],systems[3],systems[2],systems[0]];
 for(let i=0;i<order.length-1;i++)line(order[i].x,order[i].y,order[i+1].x,order[i+1].y);
 // additional links
 for(let i=4;i<systems.length;i++){let a=systems[i],b=systems[Math.floor(rand(0,4))];if(i%2===0)line(a.x,a.y,b.x,b.y)}
 // systems: pixel planets with atmospheric halos, small moons and orbital pixels
 systems.forEach((s,i)=>{
   const colors=['#e9f3ff','#ff9d35','#42ef9c','#55dfff','#d66cff'];
   const c=colors[s.type], r=10+(i%3)*2;
   ctx.save();ctx.shadowBlur=13;ctx.shadowColor=c;
   ctx.fillStyle=c+'33';ctx.beginPath();ctx.arc(s.x,s.y,r+8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
   // blocky planet silhouette
   ctx.fillStyle='#17102e';
   ctx.fillRect(Math.round(s.x-r),Math.round(s.y-r+3),r*2,r*2-6);
   ctx.fillRect(Math.round(s.x-r+3),Math.round(s.y-r),r*2-6,r*2);
   ctx.fillStyle=c;
   ctx.fillRect(Math.round(s.x-r+3),Math.round(s.y-r+3),r*2-6,r*2-6);
   ctx.fillStyle='rgba(255,255,255,.55)';
   ctx.fillRect(Math.round(s.x-r+5),Math.round(s.y-r+5),Math.max(3,r*.55),3);
   ctx.fillStyle='rgba(8,8,35,.4)';
   ctx.fillRect(Math.round(s.x+1),Math.round(s.y+2),Math.max(3,r*.6),Math.max(3,r*.5));
   ctx.fillStyle='#fff';
   ctx.fillRect(Math.round(s.x-r-2),Math.round(s.y),3,3);
   ctx.fillRect(Math.round(s.x+r),Math.round(s.y-r+2),3,3);
   // orbit ring
   ctx.strokeStyle=s.seen?'rgba(75,235,255,.62)':'rgba(255,190,85,.55)';
   ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.ellipse(s.x,s.y,r+8,r+4,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
   ctx.restore();
 });
 // forward direction indicator
 ctx.save();ctx.translate(w/2,h*.48);ctx.rotate(angle);ctx.strokeStyle='rgba(69,237,255,.18)';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(0,-h*.35);ctx.stroke();ctx.restore();
 requestAnimationFrame(draw);
}
function updateShip(){document.querySelector('#ship svg').style.transform=`rotate(${angle}rad)`;document.querySelector('.trail').style.transform=`translateX(-50%) rotate(${angle}rad)`}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1300)}
function turn(dir){angle+=dir*.22;updateShip()}
function move(){if(fuel<=0){showToast('ТОПЛИВО ЗАКОНЧИЛОСЬ — НУЖНА ЗАПРАВКА');return}fuel--;travel++;let dx=Math.sin(angle),dy=-Math.cos(angle);systems.forEach(s=>{s.x-=dx*12;s.y-=dy*12});if(travel%5===0){sector++;systems.push({x:rand(20,w-20),y:rand(110,h*.78),type:Math.floor(rand(0,5)),name:'Система '+(travel+10),seen:false});if(systems.length>32)systems.shift();showToast('НОВЫЙ УЧАСТОК ГАЛАКТИКИ');}document.getElementById('fuel').textContent=fuel;document.getElementById('coords').textContent=`СЕКТОР ${String(sector).padStart(2,'0')} : ${String(travel+14).padStart(3,'0')}`;let nearest=systems.reduce((a,b)=>Math.hypot(b.x-w/2,b.y-h*.48)<Math.hypot(a.x-w/2,a.y-h*.48)?b:a,systems[0]);document.getElementById('nearby').textContent='БЛИЖАЙШАЯ СИСТЕМА: '+nearest.name;}
document.getElementById('left').addEventListener('click',()=>turn(-1));document.getElementById('right').addEventListener('click',()=>turn(1));document.getElementById('forward').addEventListener('click',move);
let keys={};window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')turn(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')turn(1);if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')move()});
window.addEventListener('resize',resize);resize();updateShip();
})();
</script>
</body></html>
