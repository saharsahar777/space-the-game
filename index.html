<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE 0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08051b;touch-action:none}
#game{position:relative;width:100%;height:100dvh;min-height:480px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#24105b 0,#10072c 48%,#050817 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ship{position:absolute;left:50%;top:48%;width:0;height:0;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 0 8px #ff315d);pointer-events:none}
.ship svg{width:58px;height:80px;overflow:visible;transform-origin:50% 50%}
.controlbar{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:clamp(22px,9vw,48px);z-index:6}
.ctrl{width:62px;height:62px;border-radius:50%;border:2px solid #a5faff;background:radial-gradient(circle at 35% 25%,#226f83,#09253c 70%);color:#dfffff;box-shadow:0 0 15px #21dfff66,inset 0 0 12px #36f5ff33;display:grid;place-items:center;font-size:25px;font-weight:900;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl.forward{width:76px;height:76px;border-color:#7dffe1;background:radial-gradient(circle at 35% 25%,#14c9a1,#00644f 70%);box-shadow:0 0 22px #00ffc477,inset 0 0 14px #caffef55;font-size:30px}
.ctrl:active{transform:scale(.93);filter:brightness(1.4)}
@media(min-width:700px){#game{max-width:430px;margin:auto;border-left:1px solid #46316b;border-right:1px solid #46316b}}
</style>
</head>
<body>
<div id="game">
<canvas id="space"></canvas>
<div class="ship" id="ship">
 <svg viewBox="0 0 64 88" shape-rendering="crispEdges" aria-label="Пиксельный корабль игрока">
  <g stroke="#17142c" stroke-width="2" stroke-linejoin="miter">
   <path fill="#9bff42" d="M8 42h8V25h5v-8h5v18h-5v20h-8v-7H8zM56 42h-8V25h-5v-8h-5v18h5v20h8v-7h5z"/>
   <path fill="#d72d65" d="M27 3h10v8h5v10h5v19h-7v12H24V40h-7V21h5V11h5z"/>
   <path fill="#f6d9e6" d="M27 3h10v8H27zM22 18h5v9h-5zM37 18h5v9h-5zM17 34h7v8h-7zM40 34h7v8h-7z"/>
   <path fill="#3ce8ff" d="M29 17h6v7h4v17h-4v9h-6v-9h-4V24h4z"/>
   <path fill="#fff1a8" d="M29 11h6v6h-6z"/>
   <path fill="#a7b8ca" d="M24 49h16v7H24zM19 56h7v8h-7zM38 56h7v8h-7z"/>
   <path fill="#ff4b9a" d="M21 64h5v12h-5zM38 64h5v12h-5z"/>
   <path fill="#fff" d="M28 55h8v6h-8z"/>
  </g>
  <path d="M23 76h4l-2 8zM37 76h4l-2 8z" fill="#48f4ff"/>
 </svg>
</div>
<div class="controlbar">
 <button class="ctrl" id="left" aria-label="Повернуть влево">◀</button>
 <button class="ctrl forward" id="forward" aria-label="Лететь вперёд">▲</button>
 <button class="ctrl" id="right" aria-label="Повернуть вправо">▶</button>
</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  const game = document.getElementById('game');
  const shipArt = document.querySelector('#ship svg');
  const engineTrail = document.querySelector('.trail');

  let width = 0;
  let height = 0;
  let pixelRatio = 1;
  let heading = 0;
  let fuel = 24;

  let stars = [];
  let nebulae = [];
  let systems = [];

  const random = (min, max) => Math.random() * (max - min) + min;

  function createGalaxy() {
    stars = Array.from({ length: 170 }, () => ({
      x: random(0, width),
      y: random(0, height),
      size: random(1, 2),
      brightness: random(0.3, 1),
      phase: random(0, Math.PI * 2)
    }));

    nebulae = Array.from({ length: 10 }, () => ({
      x: random(-60, width + 60),
      y: random(20, height * 0.86),
      size: random(35, 90),
      color: Math.random() < 0.7 ? '#a000e8' : '#4c27bb',
      opacity: random(0.1, 0.22)
    }));

    systems = [];

    const positions = [
      [0.16, 0.18],
      [0.83, 0.22],
      [0.18, 0.76],
      [0.84, 0.78]
    ];

    positions.forEach(([x, y], index) => {
      systems.push({
        x: width * x,
        y: height * y,
        type: index % 5
      });
    });
  }

  function resize() {
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    width = game.clientWidth;
    height = game.clientHeight;

    canvas.width = width * pixelRatio;
    canvas.height = height * pixelRatio;
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.imageSmoothingEnabled = false;

    createGalaxy();
  }

  function drawBackground() {
    const background = ctx.createLinearGradient(0, 0, width, height);
    background.addColorStop(0, '#08051e');
    background.addColorStop(0.55, '#12052f');
    background.addColorStop(1, '#05091d');

    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);
  }

  function drawNebulae() {
    nebulae.forEach(nebula => {
      ctx.save();
      ctx.globalAlpha = nebula.opacity;
      ctx.fillStyle = nebula.color;

      for (let part = 0; part < 4; part++) {
        const offsetX = Math.cos(part * 1.7) * nebula.size * 0.35;
        const offsetY = Math.sin(part * 1.9) * nebula.size * 0.25;
        const radius = nebula.size * (0.65 + part * 0.1);

        ctx.beginPath();
        ctx.arc(nebula.x + offsetX, nebula.y + offsetY, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    });
  }

  function drawStars(time) {
    stars.forEach(star => {
      const twinkle = 0.55 + 0.45 * Math.sin(time / 800 + star.phase);

      ctx.globalAlpha = star.brightness * twinkle;
      ctx.fillStyle = '#fff4dc';
      ctx.fillRect(
        Math.round(star.x),
        Math.round(star.y),
        star.size > 1.5 ? 2 : 1,
        star.size > 1.5 ? 2 : 1
      );
    });

    ctx.globalAlpha = 1;
  }

  function drawSystems() {
    const colors = ['#e9f3ff', '#ff9d35', '#42ef9c', '#55dfff', '#d66cff'];

    systems.forEach((system, index) => {
      const color = colors[system.type];
      const size = 25 + (index % 3) * 5;

      ctx.save();
      ctx.shadowBlur = 13;
      ctx.shadowColor = color;
      ctx.fillStyle = color + '33';
      ctx.beginPath();
      ctx.arc(system.x, system.y, size + 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#17102e';
      ctx.fillRect(Math.round(system.x - size), Math.round(system.y - size + 3), size * 2, size * 2 - 6);
      ctx.fillRect(Math.round(system.x - size + 3), Math.round(system.y - size), size * 2 - 6, size * 2);

      ctx.fillStyle = color;
      ctx.fillRect(Math.round(system.x - size + 3), Math.round(system.y - size + 3), size * 2 - 6, size * 2 - 6);

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(Math.round(system.x - size + 5), Math.round(system.y - size + 5), Math.max(3, size * 0.55), 3);

      ctx.fillStyle = 'rgba(8,8,35,0.4)';
      ctx.fillRect(Math.round(system.x + 1), Math.round(system.y + 2), Math.max(3, size * 0.6), Math.max(3, size * 0.5));

      ctx.strokeStyle = 'rgba(75,235,255,0.62)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.ellipse(system.x, system.y, size + 8, size + 4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });
  }

  function render(time) {
    ctx.clearRect(0, 0, width, height);
    drawBackground();
    drawNebulae();
    drawStars(time);
    drawSystems();
  }

  function updateShip() {
    shipArt.style.transform = `rotate(${heading}rad)`;
  }

  function turn(direction) {
    heading += direction * turnStep;
    updateShip();
  }

  function thrust() {
    if (fuel <= 0) return;

    fuel -= 1;

    const stepDistance = 42;
    const movementX = Math.sin(heading) * stepDistance;
    const movementY = -Math.cos(heading) * stepDistance;

    systems.forEach(system => {
      system.x -= movementX;
      system.y -= movementY;

      if (system.x < -70) system.x = width + 70;
      if (system.x > width + 70) system.x = -70;
      if (system.y < -70) system.y = height + 70;
      if (system.y > height + 70) system.y = -70;
    });
  }

  function frame(time) {
    render(time);
    requestAnimationFrame(frame);
  }

  document.getElementById('left').addEventListener('click', () => turn(-1));
  document.getElementById('right').addEventListener('click', () => turn(1));
  document.getElementById('forward').addEventListener('click', thrust);

  window.addEventListener('keydown', event => {
    if (event.repeat) return;

    if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') turn(-1);
    if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') turn(1);
    if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'w' || event.key === ' ') thrust();
  });

  window.addEventListener('resize', resize);

  resize();
  updateShip();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
